<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Consulta de endereço por CEP</h1>

<form id="formulario">
    <input id="cep" placeholder="Ex.: 20031-170" maxlength="9" required>
    <button>Consultar</button>
</form>

<p id="mensagem"></p>

<table id="resultado" hidden>
    <tr><th>CEP</th><td id="cepResultado"></td></tr>
    <tr><th>Logradouro</th><td id="logradouro"></td></tr>
    <tr><th>Complemento</th><td id="complemento"></td></tr>
    <tr><th>Bairro</th><td id="bairro"></td></tr>
    <tr><th>Cidade</th><td id="localidade"></td></tr>
    <tr><th>UF</th><td id="uf"></td></tr>
    <tr><th>DDD</th><td id="ddd"></td></tr>
</table>

<script>
    const formulario = document.querySelector("#formulario");
    const mensagem = document.querySelector("#mensagem");
    const resultado = document.querySelector("#resultado");

    formulario.onsubmit = async (event) => {
        event.preventDefault();
        resultado.hidden = true;
        mensagem.textContent = "";
        const cep = document.querySelector("#cep").value;
        const response = await fetch(
            `http://localhost:8080/enderecos/${encodeURIComponent(cep)}`
        );
        const endereco = await response.json();
        if (!response.ok) {
            mensagem.textContent = endereco.mensagem;
            return;
        }
        document.querySelector("#cepResultado").textContent = endereco.cep || "-";
        document.querySelector("#logradouro").textContent = endereco.logradouro || "-";
        document.querySelector("#complemento").textContent = endereco.complemento || "-";
        document.querySelector("#bairro").textContent = endereco.bairro || "-";
        document.querySelector("#localidade").textContent = endereco.localidade || "-";
        document.querySelector("#uf").textContent = endereco.uf || "-";
        document.querySelector("#ddd").textContent = endereco.ddd || "-";
        resultado.hidden = false;
    };
</script>
</body>
</html>
